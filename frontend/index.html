<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Crop Disease Detector</title>
<style>
  body {
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    max-width: 600px;
    margin: 40px auto;
    padding: 0 20px;
    background: #f7f9f7;
    color: #222;
  }
  h1 {
    color: #2e7d32;
  }
  .card {
    background: white;
    border-radius: 10px;
    padding: 24px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    margin-bottom: 20px;
  }
  input[type="file"] {
    margin-bottom: 12px;
  }
  button {
    background: #2e7d32;
    color: white;
    border: none;
    padding: 10px 20px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 15px;
  }
  button:disabled {
    background: #999;
    cursor: not-allowed;
  }
  #preview {
    max-width: 100%;
    max-height: 300px;
    border-radius: 8px;
    margin-top: 12px;
    display: none;
  }
  .result-row {
    display: flex;
    justify-content: space-between;
    padding: 6px 0;
    border-bottom: 1px solid #eee;
  }
  #tip {
    background: #eef7ee;
    padding: 12px;
    border-radius: 8px;
    margin-top: 12px;
  }
  #error {
    color: #c62828;
    margin-top: 10px;
  }
  .spinner {
    display: none;
  }
</style>
</head>
<body>

<h1>🌿 Crop Disease Detector</h1>
<p>Upload a leaf image to get an instant diagnosis.</p>

<div class="card">
  <!-- Change this URL to your deployed backend URL once hosted -->
  <input type="hidden" id="apiUrl" value="http://localhost:8000">

  <input type="file" id="imageInput" accept="image/*">
  <br>
  <img id="preview" alt="preview">
  <br>
  <button id="predictBtn" onclick="predict()">Analyze Leaf</button>
  <span class="spinner" id="spinner">Analyzing...</span>
  <div id="error"></div>
</div>

<div class="card" id="resultCard" style="display:none;">
  <h2 id="predictedClass"></h2>
  <div class="result-row">
    <span>Confidence</span>
    <strong id="confidence"></strong>
  </div>
  <h3>Top 3 Possibilities</h3>
  <div id="top3"></div>
  <div id="tip"></div>
</div>

<script>
  const imageInput = document.getElementById('imageInput');
  const preview = document.getElementById('preview');
  const predictBtn = document.getElementById('predictBtn');
  const spinner = document.getElementById('spinner');
  const errorDiv = document.getElementById('error');
  const resultCard = document.getElementById('resultCard');

  imageInput.addEventListener('change', () => {
    const file = imageInput.files[0];
    if (file) {
      preview.src = URL.createObjectURL(file);
      preview.style.display = 'block';
      resultCard.style.display = 'none';
      errorDiv.textContent = '';
    }
  });

  async function predict() {
    const file = imageInput.files[0];
    if (!file) {
      errorDiv.textContent = 'Please choose an image first.';
      return;
    }

    const apiUrl = document.getElementById('apiUrl').value;
    const formData = new FormData();
    formData.append('file', file);

    predictBtn.disabled = true;
    spinner.style.display = 'inline';
    errorDiv.textContent = '';
    resultCard.style.display = 'none';

    try {
      const response = await fetch(`${apiUrl}/predict`, {
        method: 'POST',
        body: formData
      });

      if (!response.ok) {
        const err = await response.json();
        throw new Error(err.detail || 'Prediction failed');
      }

      const data = await response.json();
      renderResult(data);
    } catch (err) {
      errorDiv.textContent = `Error: ${err.message}. Is the backend running at ${apiUrl}?`;
    } finally {
      predictBtn.disabled = false;
      spinner.style.display = 'none';
    }
  }

  function renderResult(data) {
    document.getElementById('predictedClass').textContent = data.predicted_class;
    document.getElementById('confidence').textContent = `${data.confidence}%`;

    const top3Div = document.getElementById('top3');
    top3Div.innerHTML = '';
    data.top3.forEach(item => {
      const row = document.createElement('div');
      row.className = 'result-row';
      row.innerHTML = `<span>${item.class_name}</span><strong>${item.confidence}%</strong>`;
      top3Div.appendChild(row);
    });

    document.getElementById('tip').textContent = data.treatment_tip;
    resultCard.style.display = 'block';
  }
</script>

</body>
</html>
